<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lawwale</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #f0f4f8 0%, #e1e9f5 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; height: 90vh; background: white; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        
        /* Header */
        .header { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
        .bot-info { display: flex; align-items: center; gap: 12px; }
        .ai-icon { width: 36px; height: 36px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .title { font-size: 18px; font-weight: 600; }

        /* NEW: Reset Button Style */
        .reset-btn { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 4px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .reset-btn:hover { background: rgba(255, 255, 255, 0.4); }

        /* Messages Area */
        .messages { flex: 1; padding: 20px; overflow-y: auto; background: linear-gradient(to bottom, #f9fafb, #f3f4f6); display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
        .messages::-webkit-scrollbar { display: none; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; position: relative; animation: fadeIn 0.2s ease-out; word-wrap: break-word; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .agent { align-self: flex-start; background: white; border: 1px solid #e5e7eb; border-top-left-radius: 4px; color: #1f2937; }
        .user { align-self: flex-end; background: #dcf8c6; border: 1px solid #c9f1bd; border-top-right-radius: 4px; color: #1f2937; }
        .time { font-size: 11px; color: #6b7280; text-align: right; margin-top: 4px; }

        /* Typing Indicator */
        .typing-indicator { align-self: flex-start; padding: 12px 16px; background: white; border: 1px solid #e5e7eb; border-radius: 18px; border-top-left-radius: 4px; font-size: 14px; color: #6b7280; display: none; }
        .typing-dot { display: inline-block; animation: bounce 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

        /* Input Bar */
        .input-bar { padding: 12px 16px; background: white; border-top: 1px solid #e5e7eb; display: flex; align-items: flex-end; gap: 10px; }
        #messageInput { flex: 1; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 24px; outline: none; font-size: 15px; background: #f9fafb; resize: none; overflow-y: auto; min-height: 44px; max-height: 120px; line-height: 1.4; font-family: inherit; scrollbar-width: none; }
        #messageInput::-webkit-scrollbar { display: none; }
        #sendButton { background: #6366f1; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-bottom: 2px; }
        #sendButton:disabled { background: #a5a6f6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <div class="bot-info">
                <div class="ai-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M6 8l-4 9h8l-4-9zM18 8l-4 9h8l-4-9zM3 8h6M15 8h6M12 3l-6 3M12 3l6 3"/></svg>
                </div>
                <div class="title">Lawwale</div>
            </div>
            <button class="reset-btn" id="clearBtn">Clear Chat</button>
        </div>

        <div class="messages" id="messages">
            <div class="message agent">
                <div class="text">Hello! Welcome to Lawwale. How can I help you with your legal questions today?</div>
                <div class="time">Just now</div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">Lawwale is typing<span class="typing-dot">.</span><span class="typing-dot">.</span><span class="typing-dot">.</span></div>

        <div class="input-bar">
            <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
            <button id="sendButton">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const messagesContainer = document.getElementById('messages');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const typingIndicator = document.getElementById('typingIndicator');
            const clearBtn = document.getElementById('clearBtn'); // New

            const MAKE_WEBHOOK_URL = "https://profithax.app.n8n.cloud/webhook/Lawwale.com";

            // Manage Session
            let sessionId = localStorage.getItem('lawvale_session_id');
            if (!sessionId) {
                sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('lawvale_session_id', sessionId);
            }

            // Logic to Clear Chat (Old Data Reset)
            clearBtn.addEventListener('click', () => {
                localStorage.removeItem('lawvale_session_id');
                location.reload(); // Refresh to start a brand new session
            });

            messageInput.addEventListener('input', function() {
                this.style.height = 'auto'; 
                this.style.height = (this.scrollHeight) + 'px'; 
                if (this.value === '') this.style.height = 'auto';
            });

            function scrollToBottom() { messagesContainer.scrollTop = messagesContainer.scrollHeight; }

            function addMessage(text, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user' : 'agent'}`;
                const now = new Date();
                const timeString = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
                messageDiv.innerHTML = `<div class="text" style="white-space: pre-wrap;">${text}</div><div class="time">${timeString}</div>`;
                messagesContainer.appendChild(messageDiv);
                scrollToBottom();
            }

            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text) return;

                addMessage(text, true);
                messageInput.value = '';
                messageInput.style.height = 'auto';
                sendButton.disabled = true;
                typingIndicator.style.display = 'block';

                try {
                    const response = await fetch(MAKE_WEBHOOK_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, threadId: sessionId, date: new Date().toISOString() })
                    });

                    const responseText = await response.text();
                    typingIndicator.style.display = 'none';

                    if (responseText.includes("Too many requests")) {
                        addMessage("⚠️ Make.com is busy. Wait 60 seconds and try again!", false);
                    } else {
                        try {
                            const data = JSON.parse(responseText);
                            addMessage(data.reply || data.response || responseText, false);
                        } catch {
                            addMessage(responseText, false);
                        }
                    }
                } catch (error) {
                    typingIndicator.style.display = 'none';
                    addMessage("⚠️ Connection error. Check your Make scenario!", false);
                } finally {
                    sendButton.disabled = false;
                }
            }

            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sendButton.disabled) sendMessage(); } });
        });
    </script>
</body>
</html>
